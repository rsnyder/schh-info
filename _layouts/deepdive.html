---
layout: app
---
<div class="container prose">
    <header class="page-header">
        <p class="dd-back"><a href="/deep-dives/">&larr; All Deep Dives</a></p>
        <h1>{{ page.title }}</h1>
        <p class="subheading">{{ page.date | date: "%B %-d, %Y" }} &middot;
           Researched and written with AI, then cross-checked —
           <a href="/deep-dives/#how">how Deep Dives are made</a></p>
    </header>
    {{ content }}
    <p class="callout">Have a correction, a source, or an idea for a future
       Deep Dive? <a href="/contact/">Let us know</a>.</p>
</div>
<script>
(function () {
    // Markdown can't wrap a table, so give each one a horizontal-scroll
    // container here (see .table-scroll in app.css).
    document.querySelectorAll(".prose table").forEach(function (t) {
        if (t.parentElement.classList.contains("table-scroll")) return;
        var wrap = document.createElement("div");
        wrap.className = "table-scroll";
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
        // Column labels for the stacked phone layout (see the phone rules
        // under .table-scroll in app.css).
        var heads = Array.prototype.map.call(t.querySelectorAll("thead th"), function (th) {
            return th.textContent.trim();
        });
        t.querySelectorAll("tbody tr").forEach(function (row) {
            Array.prototype.forEach.call(row.children, function (cell, i) {
                if (i > 0 && heads[i]) cell.setAttribute("data-label", heads[i]);
            });
        });
    });
})();
</script>

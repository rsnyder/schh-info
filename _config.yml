# -----------------------------------------------
# Site identity
# -----------------------------------------------
title:       "SCHH Community Guide"
description: "A resident-created, AI-powered guide to community information and local resources."
tagline:     "A resident-created companion for finding your way around community information."
url:         "https://schh.info"
baseurl:     ""

# -----------------------------------------------
# Chatbot backend (self-hosted, residents only)
# The chat client on / talks to this API. Access requires resident
# verification: the user's email is checked against the SCHH Resident
# Directory, then a one-time code is emailed (currently valid 60 days).
# -----------------------------------------------
chatbot:
  url: "https://chat.schh.info"

# -----------------------------------------------
# Analytics (Umami Cloud for now; point script at a self-hosted
# instance later if we migrate). Tracking is emitted only when
# website_id is set — leave it blank to disable entirely.
# -----------------------------------------------
analytics:
  script:     "https://cloud.umami.is/script.js"
  website_id: "9a30006d-503a-4ab5-8c01-0f0705350c03"

# -----------------------------------------------
# Deep Dives — deeply-researched articles, one Markdown file per article
# in _deepdives/. Filename becomes the URL (two-counties.md ->
# /deep-dives/two-counties/), so name files with a plain slug and put the
# date in front matter:
#   ---
#   title: "One Community, Two Counties"
#   date: 2026-08-22
#   summary: "How SCHH spans Beaufort and Jasper counties..."
#   ---
# Articles are also ingested into the chat knowledge base by the guide
# pipeline (src/ingest_deepdives.py fetches this folder via the GitHub
# API), so committing here is the ONLY publish step.
# -----------------------------------------------
# future: true because an article's front-matter date is editorial (the
# publication date shown on the page), not a scheduling instruction —
# without this, Jekyll silently skips generating any future-dated
# article's page while the index still links it (live 404, 2026-08-21).
future: true
# Research Briefs: the finished sample briefs are live and every other card
# links to the coming-soon explainer at /vendors/commission/. Set false to
# hide the link (briefs that exist still show).
research_briefs: true

collections:
  deepdives:
    output: true
    permalink: /deep-dives/:name/
  # Vendor Research Briefs (prototype, docs/research_briefs_vision.md in the
  # guide repo). A file's vendor_id front matter is what wires the brief to
  # its directory card. Deliberately NOT under _deepdives, which the daily
  # pipeline ingests into the knowledge base.
  briefs:
    output: true
    permalink: /vendors/briefs/:name/
defaults:
  - scope:
      type: deepdives
    values:
      layout: deepdive
      slug: deep-dives
  - scope:
      type: briefs
    values:
      layout: brief
      slug: vendors
      noindex: true

# -----------------------------------------------
# Navigation — rendered as the bottom tab bar on phones and the
# top-bar links on larger screens. Icons map to _includes/icon.html.
# -----------------------------------------------
nav:
  brand: "SCHH Community Guide"
  # Primary tab bar (phones) — hard limit of 5 slots. The desktop top
  # bar shows these plus everything under `more`.
  links:
    - text: "Ask"
      url: "/"
      icon: "chat"
    - text: "Links"
      url: "/links/"
      icon: "link"
    - text: "FAQs"
      url: "/faq/"
      icon: "info"
    - text: "Vendors"
      url: "/vendors/"
      icon: "shopping-bag"
    - text: "More"
      url: "/more/"
      icon: "more-horiz"
  # Secondary destinations, listed on the /more/ page. `short` is the
  # compact label used in the desktop top bar.
  more:
    - text: "About the Guide"
      short: "About"
      url: "/about/"
      icon: "info"
    - text: "Contact Us"
      short: "Contact"
      url: "/contact/"
      icon: "mail"
    - text: "Put the Guide on Your Phone"
      short: "Install"
      url: "/install/"
      icon: "smartphone"
    - text: "Community Map"
      short: "Map"
      url: "/map/"
      icon: "map-marker"
    - text: "Deep Dives"
      short: "Deep Dives"
      url: "/deep-dives/"
      icon: "book"
    - text: "Tips & Tricks"
      short: "Tips"
      url: "/tips/"
      icon: "star"
    - text: "Sponsors"
      short: "Sponsors"
      url: "/sponsors/"
      icon: "heart"
    # Lives on chat.schh.info, outside the PWA scope, so it is marked
    # external — the templates open those in a browser tab rather than
    # replacing the installed app's window, which has no back button.
    - text: "Recent Updates"
      short: "Updates"
      url: "https://chat.schh.info/sources/updates.html"
      icon: "refresh"
      external: true

# -----------------------------------------------
# About page  (long-form copy lives in _data/about.yml)
# -----------------------------------------------
about:
  heading: "About the SCHH Community Guide"

# -----------------------------------------------
# Contact page
# -----------------------------------------------
contact:
  heading:      "Contact Us"
  subheading:   "Found an error? Want to suggest content? We'd love to hear from you."
  endpoint: "https://schh-contact.netlify.app/.netlify/functions/contact"
  # Fallback shown on the contact-error page when the form endpoint is down
  email: "contact@schh.info"

# -----------------------------------------------
# Footer
# -----------------------------------------------
footer:
  disclaimer: >-
    This is an unofficial, resident-created resource. It is not affiliated
    with, sponsored by, or endorsed by the Community Association or the
    developer.

# -----------------------------------------------
# Build settings
# -----------------------------------------------
markdown:  kramdown
permalink: pretty
